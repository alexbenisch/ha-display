################################################################################
# ha-display — ESPHome config
# Device: GUITION JC8012P4A1C (ESP32-P4 + ESP32-C6, 10.1" 1280×800 landscape)
# Based on: github.com/jtenniswood/esphome-lvgl (Waveshare P4 template)
################################################################################

substitutions:
  name: "ha-display"
  friendly_name: "Eltern Display"
  button_on_color:      "0x03a9f4"
  button_control_color: "0x1c2535"
  button_text_color:    "0xe5e7eb"
  button_width:         "410px"
  button_height:        "200px"
  radius:               "12px"
  icon_font:            icon_font
  icon_solar:   "\U000F140B"
  icon_battery: "\U000F008E"
  icon_power:   "\U000F0425"
  icon_thermo:  "\U000F050F"
  icon_wifi:    "\U000F05A9"
  icon_meter:   "\U000F06A5"
  icon_bolt:    "\U000F0E63"
  icon_plug:    "\U000F0335"

# ─── Identity ─────────────────────────────────────────────────────────────────

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# ─── Processor ────────────────────────────────────────────────────────────────

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# ─── WiFi (ESP32-C6 via SDIO) ─────────────────────────────────────────────────

esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "ha-display Fallback"
    password: !secret ap_password

captive_portal:

# ─── Core services ────────────────────────────────────────────────────────────

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# ─── Time ─────────────────────────────────────────────────────────────────────

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            static char buf[6];
            auto t = id(sntp_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return buf;

# ─── External components ──────────────────────────────────────────────────────

external_components:
  - source: github://kvj/esphome@jd9365_gsl3680
    components: [gsl3680]
  - source:
      type: local
      path: custom_components
    components: [display_screenshot]

display_screenshot:
  display_id: main_display

# ─── Hardware ─────────────────────────────────────────────────────────────────

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_pwm

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms
    internal: true

display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_display
    reset_pin: GPIO27
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gsl3680
    id: touch
    interrupt_pin: GPIO21
    reset_pin: GPIO22
    i2c_id: bus_a

# ─── Fonts ────────────────────────────────────────────────────────────────────

font:
  - file: "gfonts://Roboto"
    id: font_sm
    size: 24
    bpp: 4
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz .,:-+°%/äöüÄÖÜ"
  - file: "gfonts://Roboto"
    id: font_md
    size: 32
    bpp: 4
    glyphs: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz .,:-+°%/äöüÄÖÜ"
  - file: "gfonts://Roboto"
    id: font_lg
    size: 48
    bpp: 4
    glyphs: "0123456789.,:-+°% WVAkwhC"
  - file: "gfonts://Roboto"
    id: font_xl
    size: 72
    bpp: 4
    glyphs: "0123456789.,:-+°% WVAkwhC"
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: icon_font
    size: 48
    bpp: 4
    glyphs:
      - "\U000F0425"  # mdi-power
      - "\U000F008E"  # mdi-battery
      - "\U000F006E"  # mdi-battery-high (alias)
      - "\U000F05A9"  # mdi-wifi
      - "\U000F0141"  # mdi-chevron-left
      - "\U000F0142"  # mdi-chevron-right
      - "\U000F050F"  # mdi-thermometer
      - "\U000F140B"  # mdi-solar-power-variant
      - "\U000F0D43"  # mdi-air-filter (inverter)
      - "\U000F0E63"  # mdi-lightning-bolt
      - "\U000F06A5"  # mdi-gauge
      - "\U000F0335"  # mdi-lightbulb

# ─── LVGL theme ───────────────────────────────────────────────────────────────

lvgl:
  displays:
    - main_display
  touchscreens:
    - touch
  rotation: 90
  color_depth: 16
  buffer_size: 25%
  byte_order: little_endian
  bg_color: 0x111827

  style_definitions:
    - id: card
      bg_color: 0x1c2535
      bg_opa: COVER
      border_color: 0x374151
      border_width: 1
      radius: 12
      pad_all: 16

  theme:
    button:
      bg_color: $button_control_color
      bg_opa: COVER
      text_color: $button_text_color
      radius: $radius
      shadow_width: 0
      checked:
        bg_color: $button_on_color
        text_color: $button_text_color

  # ── Always-visible status bar ──────────────────────────────────────────────
  top_layer:
    widgets:
      - obj:
          width: 1280
          height: 52
          x: 0
          y: 0
          bg_color: 0x0d1117
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          widgets:
            - label:
                id: lbl_title
                text: "PV DASHBOARD"
                text_font: font_md
                text_color: 0x03a9f4
                align: left_mid
                x: 24
            - label:
                id: lbl_time
                text: "--:--"
                text_font: font_md
                text_color: 0xa1a1aa
                align: right_mid
                x: -24

  # ── Pages ─────────────────────────────────────────────────────────────────
  pages:

    ##########################################################################
    # Page 1: Solar
    ##########################################################################
    - id: page_solar
      bg_color: 0x111827
      bg_opa: COVER
      pad_top: 52
      pad_bottom: 60
      pad_left: 12
      pad_right: 12
      layout:
        type: flex
        flex_flow: row
        flex_align_cross: stretch

      widgets:

        # Left column — Akku arcs
        - obj:
            width: 380
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_cross: center

            widgets:
              # Master arc
              - obj:
                  styles: card
                  width: 360
                  height: 300
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    flex_align_main: center
                  widgets:
                    - label:
                        text: "MASTER"
                        text_font: font_sm
                        text_color: 0x9ca3af
                    - arc:
                        id: arc_master
                        width: 180
                        height: 180
                        value: 0
                        min_value: 0
                        max_value: 100
                        adjustable: false
                        arc_color: 0x374151
                        arc_width: 16
                        indicator:
                          arc_color: 0x22c55e
                          arc_width: 16
                        widgets:
                          - label:
                              id: lbl_master_pct
                              text: "--%"
                              text_font: font_md
                              text_color: 0xe5e7eb
                              align: center
                    - label:
                        id: lbl_master_temp
                        text: "--°C"
                        text_font: font_sm
                        text_color: 0xf59e0b

              # Slave arc
              - obj:
                  styles: card
                  width: 360
                  height: 300
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    flex_align_main: center
                  widgets:
                    - label:
                        text: "SLAVE"
                        text_font: font_sm
                        text_color: 0x9ca3af
                    - arc:
                        id: arc_slave
                        width: 180
                        height: 180
                        value: 0
                        min_value: 0
                        max_value: 100
                        adjustable: false
                        arc_color: 0x374151
                        arc_width: 16
                        indicator:
                          arc_color: 0x22c55e
                          arc_width: 16
                        widgets:
                          - label:
                              id: lbl_slave_pct
                              text: "--%"
                              text_font: font_md
                              text_color: 0xe5e7eb
                              align: center
                    - label:
                        id: lbl_slave_temp
                        text: "--°C"
                        text_font: font_sm
                        text_color: 0xf59e0b

        # Right column — inverter + forecast
        - obj:
            width: 876
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_left: 12
            pad_right: 0
            pad_top: 0
            pad_bottom: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_between

            widgets:

              # Hero row: 3 tiles
              - obj:
                  width: 100%
                  height: 140
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - obj:
                        styles: card
                        width: 274
                        height: 140
                        layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: center}
                        widgets:
                          - label: {text: "Leistung", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_inv_output, text: "--- W", text_font: font_lg, text_color: 0x22c55e}
                    - obj:
                        styles: card
                        width: 274
                        height: 140
                        layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: center}
                        widgets:
                          - label: {text: "Max Wert", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_inv_setpoint, text: "--- W", text_font: font_lg, text_color: 0xe5e7eb}
                    - obj:
                        styles: card
                        width: 274
                        height: 140
                        layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: center}
                        widgets:
                          - label: {text: "Temperatur", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_inv_temp, text: "---", text_font: font_lg, text_color: 0xf59e0b}

              # Solar Status
              - obj:
                  styles: card
                  width: 100%
                  height: 220
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: space_evenly

                  widgets:
                    - label:
                        text: "Solar Status"
                        text_font: font_md
                        text_color: 0x03a9f4
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "PV Leistung", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_pv_leistung, text: "--- W", text_font: font_sm, text_color: 0xf59e0b}
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Ertrag heute", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_ertrag_heute, text: "--- kWh", text_font: font_sm, text_color: 0x22c55e}
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Ladestrom", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_ladestrom, text: "--- A", text_font: font_sm, text_color: 0x22c55e}
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Max. Leistung heute", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_max_pv_heute, text: "---", text_font: font_sm, text_color: 0xe5e7eb}

              # Solar forecast
              - obj:
                  styles: card
                  width: 100%
                  height: 220
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: space_evenly

                  widgets:
                    - label:
                        text: "Solar Prognose"
                        text_font: font_md
                        text_color: 0x03a9f4
                    - obj:
                        width: 820
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Jetzt", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_solar_now, text: "--- W", text_font: font_sm, text_color: 0xf59e0b}
                    - obj:
                        width: 820
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Nächste Std", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_solar_next_hour, text: "--- W", text_font: font_sm, text_color: 0xa1a1aa}
                    - obj:
                        width: 820
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Heute", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_solar_today, text: "--- kWh", text_font: font_sm, text_color: 0x22c55e}
                    - obj:
                        width: 820
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        layout: {type: flex, flex_flow: row, flex_align_main: space_between}
                        widgets:
                          - label: {text: "Morgen", text_font: font_sm, text_color: 0x9ca3af}
                          - label: {id: lbl_solar_tomorrow, text: "--- kWh", text_font: font_sm, text_color: 0x03a9f4}

    ##########################################################################
    # Page 2: Zaehler
    ##########################################################################
    - id: page_zaehler
      bg_color: 0x111827
      bg_opa: COVER
      pad_top: 64
      pad_bottom: 72
      pad_left: 16
      pad_right: 16
      layout:
        type: flex
        flex_flow: row
        flex_align_cross: stretch
        flex_align_main: space_between

      widgets:
        # Hinterhaus card
        - obj:
            styles: card
            width: 612
            height: SIZE_CONTENT
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
            widgets:
              - label: {text: "Hinterhaus", text_font: font_md, text_color: 0x03a9f4}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 12
                  pad_bottom: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Bezug aktuell", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_hh_power, text: "--- W", text_font: font_lg, text_color: 0xffffff}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 4
                  pad_bottom: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Bezug gesamt", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_hh_totalin, text: "--- kWh", text_font: font_md, text_color: 0xffffff}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Einspeisung", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_hh_totalout, text: "--- kWh", text_font: font_md, text_color: 0x22c55e}

        # 1OG Apt card
        - obj:
            styles: card
            width: 612
            height: SIZE_CONTENT
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
            widgets:
              - label: {text: "1OG Apt", text_font: font_md, text_color: 0x03a9f4}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 12
                  pad_bottom: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Bezug aktuell", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_apt_power, text: "--- W", text_font: font_lg, text_color: 0xffffff}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 4
                  pad_bottom: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Bezug gesamt", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_apt_totalin, text: "--- kWh", text_font: font_md, text_color: 0xffffff}
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 4
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {text: "Einspeisung", text_font: font_sm, text_color: 0x9ca3af}
                    - label: {id: lbl_apt_totalout, text: "--- kWh", text_font: font_md, text_color: 0x22c55e}

    ##########################################################################
    # Page 3: Steuerung
    ##########################################################################
    - id: page_steuerung
      bg_color: 0x111827
      bg_opa: COVER
      pad_top: 64
      pad_left: 24
      pad_right: 24
      layout:
        type: flex
        flex_flow: column
        flex_align_cross: center

      widgets:
        - obj:
            styles: card
            width: 700
            height: 100
            layout:
              type: flex
              flex_flow: row
              flex_align_cross: center
              flex_align_main: space_between
            widgets:
              - label: {text: "Heizmatte", text_font: font_md, text_color: 0xffffff}
              - switch:
                  id: sw_heizmatte
                  on_value:
                    then:
                      - if:
                          condition:
                            lambda: 'return x;'
                          then:
                            - homeassistant.service:
                                service: switch.turn_on
                                data: {entity_id: switch.steckdose_heizmatte}
                          else:
                            - homeassistant.service:
                                service: switch.turn_off
                                data: {entity_id: switch.steckdose_heizmatte}

  # ── Nav bar ────────────────────────────────────────────────────────────────
  # Rendered on top_layer so it overlays all pages at the bottom
  # We use buttons on each page that trigger page changes instead,
  # since top_layer z-order is above pages.

# ─── Sensors ──────────────────────────────────────────────────────────────────

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_info
      internal: true

sensor:

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    update_interval: 60s
    internal: true

  # Wechselrichter
  - platform: homeassistant
    id: inv_output
    entity_id: sensor.lumentree800_lumentree800_output
    on_value:
      - lvgl.label.update:
          id: lbl_inv_output
          text: !lambda 'return str_sprintf("%.0f W", x);'

  - platform: homeassistant
    id: inv_setpoint
    entity_id: sensor.lumentree800_lumentree800_setpoint
    on_value:
      - lvgl.label.update:
          id: lbl_inv_setpoint
          text: !lambda 'return str_sprintf("%.0f W", x);'

  - platform: homeassistant
    id: inv_temp
    entity_id: sensor.lumentree800_lumentree800_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_inv_temp
          text: !lambda 'return str_sprintf("%.0f °C", x);'

  # Akku
  - platform: homeassistant
    id: akku_master_pct
    entity_id: sensor.akku_master
    on_value:
      - lvgl.arc.update:
          id: arc_master
          value: !lambda 'return (int)x;'
      - lvgl.label.update:
          id: lbl_master_pct
          text: !lambda 'return str_sprintf("%.0f%%", x);'
      - if:
          condition: {lambda: 'return x > 60;'}
          then:
            - lvgl.arc.update: {id: arc_master, indicator: {arc_color: 0x22c55e}}
          else:
            - if:
                condition: {lambda: 'return x > 20;'}
                then:
                  - lvgl.arc.update: {id: arc_master, indicator: {arc_color: 0xf59e0b}}
                else:
                  - lvgl.arc.update: {id: arc_master, indicator: {arc_color: 0xef4444}}

  - platform: homeassistant
    id: akku_slave_pct
    entity_id: sensor.akku_slave
    on_value:
      - lvgl.arc.update:
          id: arc_slave
          value: !lambda 'return (int)x;'
      - lvgl.label.update:
          id: lbl_slave_pct
          text: !lambda 'return str_sprintf("%.0f%%", x);'
      - if:
          condition: {lambda: 'return x > 60;'}
          then:
            - lvgl.arc.update: {id: arc_slave, indicator: {arc_color: 0x22c55e}}
          else:
            - if:
